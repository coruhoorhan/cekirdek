name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'google-jules[bot]' ||
      github.event.pull_request.user.login == 'coruhoorhan'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Validate agent task manifest
        run: |
          if [ -f agent_tasks.json ]; then
            python3 -c "import json; d=json.load(open('agent_tasks.json')); tasks=d.get('tasks',[]); assert len(tasks)>0; print(f'Manifest valid: {len(tasks)} tasks')"
          else
            echo "No agent_tasks.json — skipping validation"
          fi

      - name: Mark implemented task done (google-jules only)
        if: success() && github.event.pull_request.user.login == 'google-jules[bot]'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"
          python3 - <<'PY'
          import json, os, re, unicodedata, subprocess

          def norm(s):
              s = unicodedata.normalize("NFKD", s or "")
              s = s.encode("ascii", "ignore").decode()
              return re.sub(r"[^a-z0-9]", "", s.lower())

          pr_title = norm(os.environ["PR_TITLE"])
          # Include PR body in the match; strongest signal that this PR
          # implements the task. Best-effort.
          pr_body = ""
          try:
              res = subprocess.run(
                  ["gh", "pr", "view", os.environ["PR_NUMBER"], "--json", "body", "--jq", ".body"],
                  capture_output=True, text=True, timeout=15,
              )
              if res.returncode == 0:
                  pr_body = norm(res.stdout)
          except Exception as exc:
              print(f"Warning: could not fetch PR body: {exc}")
          match_text = f"{pr_title} {pr_body}"

          with open("agent_tasks.json") as f:
              manifest = json.load(f)
          tasks = manifest.get("tasks", [])
          target = None
          for t in tasks:
              if not isinstance(t, dict) or t.get("status") != "todo":
                  continue
              tid = norm(str(t.get("id", "")))
              ttl = norm(str(t.get("title", "")))
              # Match on task id (cekirdek-001) OR normalized title appearing
              # in the PR title/body.
              if (tid and tid in match_text) or (ttl and (ttl in match_text or match_text.startswith(ttl))):
                  target = t
                  break
          if target is None:
              print("No matching todo task found for PR; leaving status unchanged.")
          else:
              target["status"] = "done"
              with open("agent_tasks.json", "w") as f:
                  json.dump(manifest, f, ensure_ascii=False, indent=2)
              print(f"Marked {target.get('id')} as done")
          PY
          if git diff --quiet -- agent_tasks.json; then
            echo "No manifest change to commit."
          else
            git config user.name "magda-loop"
            git config user.email "magda-loop@users.noreply.github.com"
            git add agent_tasks.json
            git commit -m "chore: mark implemented task done"
            git push origin "$HEAD_REF"
          fi

      - name: Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          STATE="$(gh pr view ${{ github.event.pull_request.number }} --json state,isDraft --jq '{state,isDraft}' 2>/dev/null || echo '{}')"
          if echo "$STATE" | grep -q '"isDraft":true'; then
            echo "PR is draft; skipping merge."
            exit 0
          fi
          if echo "$STATE" | grep -q '"state":"MERGED"'; then
            echo "PR already merged; nothing to do."
            exit 0
          fi
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch
          echo "PR merged successfully."# task done fix
